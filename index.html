<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Bill Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fa;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h2,h3{
text-align:center;
margin-bottom:15px;
color:#0077b6;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.calculate-btn{
background:#0077b6;
color:white;
}

.new-btn{
background:#ff9800;
color:white;
}

.share-btn{
background:#28a745;
color:white;
display:none;
}

.whatsapp-btn{
background:#25D366;
color:white;
display:none;
}

.clear-btn{
background:#dc3545;
color:white;
}

#billCard{
display:none;
margin-top:20px;
padding:20px;
border:2px solid #0077b6;
border-radius:12px;
background:white;
}

.bill-title{
text-align:center;
font-size:24px;
font-weight:bold;
color:#0077b6;
margin-bottom:10px;
}

.row{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid #eee;
}

.total{
font-size:24px;
font-weight:bold;
color:red;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th{
background:#0077b6;
color:white;
padding:10px;
}

td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h2>💧 Water Bill Calculator</h2>

<input type="text" id="apartment" placeholder="Apartment Name">

<input type="text" id="flat" placeholder="Flat Number">

<input type="text" id="customerName" placeholder="Tenant Name">

<input type="number" id="currentReading" placeholder="Current Reading">

<input type="number" id="previousReading" placeholder="Previous Reading">

<input type="number" id="paisaRate" value="11" placeholder="Paisa Per Liter">

<button class="calculate-btn" onclick="calculateBill()">
Calculate Bill
</button>

<button class="new-btn" onclick="refreshForm()">
🔄 New Bill
</button>

<div id="billCard">

<div class="bill-title">
WATER CONSUMPTION BILL
</div>

<div class="row">
<span>Apartment</span>
<span id="outApartment"></span>
</div>

<div class="row">
<span>Flat No</span>
<span id="outFlat"></span>
</div>

<div class="row">
<span>Tenant</span>
<span id="outCustomer"></span>
</div>

<div class="row">
<span>Date</span>
<span id="outDate"></span>
</div>

<div class="row">
<span>Current Reading</span>
<span id="outCurrent"></span>
</div>

<div class="row">
<span>Previous Reading</span>
<span id="outPrevious"></span>
</div>

<div class="row">
<span>Water Consumed</span>
<span id="outLiters"></span>
</div>

<div class="row total">
<span>Total Bill</span>
<span id="outBill"></span>
</div>

</div>

<button id="shareBtn"
class="share-btn"
onclick="shareBill()">
📤 Share Bill Image
</button>

<button id="whatsappBtn"
class="whatsapp-btn"
onclick="shareWhatsApp()">
📱 Share via WhatsApp
</button>

<hr style="margin:25px 0;">

<h3>📋 Bill History</h3>

<table id="historyTable">

<thead>
<tr>
<th>Date</th>
<th>Flat</th>
<th>Tenant</th>
<th>Liters</th>
<th>Bill</th>
</tr>
</thead>

<tbody></tbody>

</table>

<button
class="clear-btn"
onclick="clearHistory()">
🗑 Clear History
</button>

</div>

<script>
  function calculateBill(){

let apartment =
document.getElementById("apartment").value;

let flat =
document.getElementById("flat").value;

let customer =
document.getElementById("customerName").value;

let billDate =
new Date().toLocaleDateString("en-IN");

let current =
parseFloat(document.getElementById("currentReading").value);

let previous =
parseFloat(document.getElementById("previousReading").value);

let paisaRate =
parseFloat(document.getElementById("paisaRate").value);

if(isNaN(current) || isNaN(previous)){
alert("Please enter readings");
return;
}

if(current < previous){
alert("Current reading cannot be less than previous reading");
return;
}

let units = current - previous;
let liters = units * 10;
let amount = (liters * paisaRate) / 100;

document.getElementById("outApartment").innerText = apartment;
document.getElementById("outFlat").innerText = flat;
document.getElementById("outCustomer").innerText = customer;
document.getElementById("outDate").innerText = billDate;
document.getElementById("outCurrent").innerText = current;
document.getElementById("outPrevious").innerText = previous;
document.getElementById("outLiters").innerText = liters + " Liters";
document.getElementById("outBill").innerText = "₹" + amount.toFixed(2);

document.getElementById("billCard").style.display = "block";
document.getElementById("shareBtn").style.display = "block";
document.getElementById("whatsappBtn").style.display = "block";

saveBillHistory(flat,customer,liters,amount);

}

function refreshForm(){

document.getElementById("apartment").value="";
document.getElementById("flat").value="";
document.getElementById("customerName").value="";
document.getElementById("currentReading").value="";
document.getElementById("previousReading").value="";
document.getElementById("paisaRate").value="11";

document.getElementById("billCard").style.display="none";
document.getElementById("shareBtn").style.display="none";
document.getElementById("whatsappBtn").style.display="none";

}

async function shareBill(){

try{

const billCard =
document.getElementById("billCard");

const canvas =
await html2canvas(billCard,{scale:2});

const blob =
await new Promise(resolve =>
canvas.toBlob(resolve,"image/png")
);

const file =
new File([blob],"WaterBill.png",{type:"image/png"});

if(
navigator.share &&
navigator.canShare &&
navigator.canShare({files:[file]})
){

await navigator.share({
title:"Water Bill",
files:[file]
});

}else{

const url = URL.createObjectURL(blob);

const a = document.createElement("a");
a.href = url;
a.download = "WaterBill.png";
a.click();

URL.revokeObjectURL(url);

}

}catch(error){

alert(error.message);

}

}

function shareWhatsApp(){

const apartment =
document.getElementById("apartment").value;

const flat =
document.getElementById("flat").value;

const customer =
document.getElementById("customerName").value;

const liters =
document.getElementById("outLiters").innerText;

const bill =
document.getElementById("outBill").innerText;

const billDate =
new Date().toLocaleDateString("en-IN");

const message =

`💧 WATER BILL

Apartment: ${apartment}

Flat: ${flat}

Tenant: ${customer}

Date: ${billDate}

Water Consumed: ${liters}

Amount Payable: ${bill}

Thank You`;

window.open(
'https://wa.me/?text=' +
encodeURIComponent(message),
'_blank'
);

}

function saveBillHistory(
flat,
customer,
liters,
amount
){

let bills =
JSON.parse(localStorage.getItem("waterBills")) || [];

bills.push({
date:new Date().toLocaleDateString("en-IN"),
flat:flat,
customer:customer,
liters:liters,
amount:amount.toFixed(2)
});

localStorage.setItem(
"waterBills",
JSON.stringify(bills)
);

loadHistory();

}

function loadHistory(){

let bills =
JSON.parse(localStorage.getItem("waterBills")) || [];

const tbody =
document.querySelector("#historyTable tbody");

tbody.innerHTML="";

[...bills].reverse().forEach(bill=>{

tbody.innerHTML += `
<tr>
<td>${bill.date}</td>
<td>${bill.flat}</td>
<td>${bill.customer}</td>
<td>${bill.liters}</td>
<td>₹${bill.amount}</td>
</tr>`;

});

}

function clearHistory(){

if(confirm("Delete all bill history?")){

localStorage.removeItem("waterBills");

loadHistory();

}

}

window.onload = function(){

loadHistory();

};

</script>

</body>
</html>
