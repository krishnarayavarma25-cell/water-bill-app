<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartment Water Bill Generator</title>
    <!-- Supported library loaded via CDN -->
    <script src="https://cloudflare.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: #f5f7fa;
            padding: 20px;
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 500px;
            margin: auto;
            background: #ffffff;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2.main-title {
            text-align: center;
            color: #0077b6;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 5px 0 10px 0;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #0077b6;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-calc {
            background: #0077b6;
            color: white;
        }
        .btn-calc:hover {
            background: #005f94;
        }
        .btn-refresh {
            background: #6c757d;
            color: white;
        }
        .btn-refresh:hover {
            background: #5a6268;
        }
        .share-btn {
            background: #28a745;
            color: white;
            display: none;
            font-size: 18px;
            padding: 16px;
        }
        .share-btn:hover {
            background: #218838;
        }
        .preview-btn {
            background: #17a2b8;
            color: white;
            display: none;
        }
        .preview-btn:hover {
            background: #138496;
        }
        .history-btn {
            background: #ffc107;
            color: #212529;
            margin-top: 15px;
        }
        #billCard {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 20px;
            background: #ffffff;
            border: 2px solid #0077b6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .apartment-title {
            text-align: center;
            color: #0077b6;
            font-size: 24px;
            font-weight: bold;
        }
        .bill-subtitle {
            text-align: center;
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            gap: 10px;
        }
        .row span:last-child {
            text-align: right;
            word-break: break-word;
            font-weight: bold;
        }
        .total {
            font-size: 24px;
            color: #d32f2f;
            font-weight: bold;
            border-bottom: none;
            margin-top: 5px;
        }
        #historySection {
            display: none;
            margin-top: 20px;
            border-top: 2px dashed #ccc;
            padding-top: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            font-size: 13px;
        }
        th {
            background-color: #f2f2f2;
        }

        /* Mobile Responsive Adjustments */
        @media screen and (max-width:600px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 12px;
            }
            .apartment-title {
                font-size: 22px;
            }
            .bill-subtitle {
                font-size: 12px;
            }
            .total {
                font-size: 22px;
            }
            .row {
                font-size: 13px;
            }
            th, td {
                font-size: 12px;
                padding: 6px;
            }
            button {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="main-title">Water Bill Calculator</h2>
    <p class="subtitle">Generate clear and printable residential utility bills</p>
    
    <div class="form-group">
        <label for="flatNo">Flat / Apartment Number:</label>
        <input type="text" id="flatNo" placeholder="e.g., Block A - 302">
        
        <label for="prevReading">Previous Reading (KL/Units):</label>
        <input type="number" id="prevReading" placeholder="Enter previous value">
        
        <label for="currReading">Current Reading (KL/Units):</label>
        <input type="number" id="currReading" placeholder="Enter current value">
        
        <label for="ratePerUnit">Rate per Unit ($/₹):</label>
        <input type="number" id="ratePerUnit" value="15" placeholder="Enter rate per unit">
        
        <label for="fixedCharges">Fixed Maintenance Charges (Optional):</label>
        <input type="number" id="fixedCharges" value="0" placeholder="Enter fixed charges">
    </div>

    <button class="btn-calc" onclick="calculateBill()">Calculate Bill</button>
    <button class="btn-refresh" onclick="refreshForm()">🔄 New Bill</button>
    <button class="share-btn" id="shareBtn" onclick="shareBillImage()">📤 Share Bill Image</button>
    <button class="preview-btn" id="previewBtn" onclick="printPreview()">👁️ Print Preview</button>
    <button class="history-btn" onclick="toggleHistory()">📋 Bill History</button>

    <!-- Structural Bill Invoice -->
    <div id="billCard">
        <div class="apartment-title">WATER UTILITY BILL</div>
        <div class="bill-subtitle" id="billDate">Date: --/--/----</div>
        
        <div class="row">
            <span>Flat No:</span>
            <span id="resFlat">--</span>
        </div>
        <div class="row">
            <span>Previous Reading:</span>
            <span id="resPrev">0</span>
        </div>
        <div class="row">
            <span>Current Reading:</span>
            <span id="resCurr">0</span>
        </div>
        <div class="row">
            <span>Total Consumption:</span>
            <span id="resUnits">0 Units</span>
        </div>
        <div class="row">
            <span>Rate per Unit:</span>
            <span id="resRate">0</span>
        </div>
        <div class="row">
            <span>Fixed / Extra Charges:</span>
            <span id="resFixed">0</span>
        </div>
        <div class="row total">
            <span>Total Due:</span>
            <span id="resTotal">0.00</span>
        </div>
    </div>

    <!-- History Panel -->
    <div id="historySection">
        <h3>Calculation Log</h3>
        <table id="historyTable">
            <thead>
                <tr>
                    <th>Flat</th>
                    <th>Units</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <!-- Items dynamically append here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let billHistory = [];

    function calculateBill() {
        const flatNo = document.getElementById("flatNo").value.trim() || "N/A";
        const prevReading = parseFloat(document.getElementById("prevReading").value) || 0;
        const currReading = parseFloat(document.getElementById("currReading").value) || 0;
        const ratePerUnit = parseFloat(document.getElementById("ratePerUnit").value) || 0;
        const fixedCharges = parseFloat(document.getElementById("fixedCharges").value) || 0;

        if (currReading < prevReading) {
            alert("Error: Current reading cannot be less than the previous reading.");
            return;
        }

        const unitsConsumed = currReading - prevReading;
        const totalAmount = (unitsConsumed * ratePerUnit) + fixedCharges;
        
        const today = new Date();
        const dateString = today.toLocaleDateString() + " " + today.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        document.getElementById("billDate").innerText = "Generated: " + dateString;
        document.getElementById("resFlat").innerText = flatNo;
        document.getElementById("resPrev").innerText = prevReading;
        document.getElementById("resCurr").innerText = currReading;
        document.getElementById("resUnits").innerText = unitsConsumed + " Units";
        document.getElementById("resRate").innerText = ratePerUnit;
        document.getElementById("resFixed").innerText = fixedCharges;
        document.getElementById("resTotal").innerText = totalAmount.toFixed(2);

        document.getElementById("billCard").style.display = "block";
        document.getElementById("shareBtn").style.display = "block";
        document.getElementById("previewBtn").style.display = "block";

        // Record history log
